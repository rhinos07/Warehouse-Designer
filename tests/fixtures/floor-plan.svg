  <g fill="none" stroke="#b9c2cf" stroke-width="0.5">
    <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M0 100H600M0 200H600M0 300H600M0 400H600"/>
  </g>
  <rect x="2" y="2" width="596" height="496" fill="none" stroke="#39424e" stroke-width="4"/>
  <g fill="#e9edf2" stroke="#39424e" stroke-width="1.5">
